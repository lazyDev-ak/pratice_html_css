<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  <!-- Self Closing tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding</title>
</head>
<body>
     <div>unorder list</div>
     <ul style="list-style-type:disc;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ul>
     <ul style="list-style-type:circle;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ul>
     <ul style="list-style-type:square;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ul>
     <div>order list</div>
     <ol type="i"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ol>
     <ol style="list-style-type:lower-roman;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ol>
     <ol style="list-style-type:upper-roman;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ol>
     <ol style="list-style-type:upper-alpha;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ol>
    
     <ol style="list-style-type:upper-greek;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ol>
     <ol style="list-style-type:lower-latin;"> 
        <li>1</li>
        <li>2</li>
        <li>3</li>
     </ol> 
</body>
</html>
